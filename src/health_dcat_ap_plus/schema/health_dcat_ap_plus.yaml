---
id: https://w3id.org/portail-fresh/Health-DCAT-AP-plus
name: Health-DCAT-AP-plus
title: Health-DCAT-AP-plus
description: |-
  A schema combining HealthDCAT-AP's health-dataset metadata tiers with DCAT-AP+'s PROV-O provenance extensions (DataGeneratingActivity, Entity, AgenticEntity, Plan).
license: MIT
see_also:
  - https://portail-fresh.github.io/Health-DCAT-AP-plus

prefixes:
  health_dcat_ap_plus: https://w3id.org/portail-fresh/Health-DCAT-AP-plus/
  linkml: https://w3id.org/linkml/
  dcatapplus: https://w3id.org/nfdi-de/dcat-ap-plus/
  healthdcatap: http://healthdataportal.eu/ns/health#
  # The prefixes below are already declared in dcatapplus's/healthdcat_ap_non_public's
  # own prefixes: block, but LinkML's gen-shacl/gen-owl don't propagate an
  # imported schema's prefixes into the generated Turtle -- confirmed on
  # HealthStudy-DCAT-AP by testing, not assumed. Without these, every
  # dcterms:/dcat:/prov:/skos:/adms:/foaf:/vcard:/locn:/odrl:/spdx: property
  # renders as an undeclared CURIE in the generated SHACL/OWL instead of its
  # real IRI. Redeclared here for the same reason.
  dcterms: http://purl.org/dc/terms/
  dcat: http://www.w3.org/ns/dcat#
  prov: http://www.w3.org/ns/prov#
  skos: http://www.w3.org/2004/02/skos/core#
  adms: http://www.w3.org/ns/adms#
  foaf: http://xmlns.com/foaf/0.1/
  vcard: http://www.w3.org/2006/vcard/ns#
  locn: http://www.w3.org/ns/locn#
  odrl: http://www.w3.org/ns/odrl/2/
  spdx: http://spdx.org/rdf/terms#
  cv: http://data.europa.eu/m8g/
  dqv: http://www.w3.org/ns/dqv#
  dpv: https://w3id.org/dpv#
  csvw: http://www.w3.org/ns/csvw#
  time: http://www.w3.org/2006/time#
  geodcatap: http://data.europa.eu/930/
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  # Missed when the others above were added -- found by actually running
  # the dumper directly and seeing `@prefix ns1: <dcatap:> .` (the CURIE
  # prefix string itself used as a literal namespace) in real output, not
  # predicted. Namespace confirmed http://data.europa.eu/r5r/ (with trailing
  # slash, matching dcat-ap-plus's own declaration) during the dcatap:
  # prefix typo investigation earlier -- see the port script's
  # _KNOWN_UPSTREAM_PREFIX_FIXES.
  dcatap: http://data.europa.eu/r5r/
default_prefix: health_dcat_ap_plus
default_range: string

imports:
  - linkml:types
  - dcatapplus:latest/schema/dcat_ap_plus
  # Mechanically ported from HealthDCAT-AP's SHACL shapes by
  # scripts/port_healthdcat_ap_shacl_to_linkml.py -- see that file for the
  # method (same targetClass/sh:property-walking approach NFDI4Chem used for
  # plain DCAT-AP when building chem-dcat-ap). Regenerate after HealthDCAT-AP
  # publishes a new release; do not hand-edit the generated file itself.
  - healthdcat_ap_non_public

classes:

  Association:
    is_a: SupportiveEntity
    class_uri: prov:Association
    description: >-
      The qualified form of prov:wasAssociatedWith (what carried_out_by
      already shortcuts to, on DataGeneratingActivity/Activity) -- PROV-O's
      own Activity-side counterpart to Attribution's Entity-side
      qualification. dcat-ap-plus has no Association class at all (a bigger
      gap than Attribution, which at least has a title/description stub) --
      confirmed absent from its schema, not assumed.

      This class, and the ready-to-use qualified_association slot below
      (already correctly ranged at Association), are built here even though
      this repo's own port never touches the Activity side at all
      (HealthDCAT-AP's SHACL doesn't reach it -- confirmed in Section 1
      Check b of architecture-verification.md) and there's no Health<X>
      profile of Activity to narrow anything onto: this is exactly the kind
      of generic, domain-agnostic completion the merge layer exists to
      provide, so the downstream specialization repo gets a schema it only
      has to specialize, not one it has to finish first.
    slots:
      - agent
      - association_had_role

  AssociatedDataGeneratingActivity:
    is_a: DataGeneratingActivity
    class_uri: prov:Activity
    description: >-
      DataGeneratingActivity, with qualified_association actually wired in
      -- was_generated_by can then carry PI/sponsor/funder-style agent
      roles on a real HealthDataset instance, not just document that the
      slot exists. Originally deferred as "specialization work" (the same
      line drawn for DatasetAttribution/HealthDataset): the reasoning was
      never "Activity-side classes belong exclusively downstream," it was
      "don't invent a class before there's a real need for it." This one
      is exactly as generic as Association itself -- no health-specific
      content, just DataGeneratingActivity plus the one slot that makes
      qualified_association reachable -- so once a real need appeared (an
      end-to-end example with AgenticEntities on Activities), building it
      here is the same kind of generic completion Association already is,
      not a boundary violation.

      Can't be done by narrowing HealthDataset.was_generated_by's range
      directly onto this class from either file: HealthDataset lives in
      the generated healthdcat_ap_non_public.yaml, which doesn't import
      this file (this file imports it, not the reverse, so it can't see
      Association/qualified_association), and this file can't reopen
      HealthDataset's own already-imported slot_usage either (confirmed
      elsewhere this session: reopening an imported class throws
      "Conflicting URIs"). Used directly instead, by constructing real
      instances of this class in place of plain DataGeneratingActivity
      ones -- isinstance-compatible since it's a real subclass, so
      LinkML's own inlined-list construction (_normalize_inlined_as_list)
      accepts an already-built instance as-is without needing to touch
      was_generated_by's declared range at all. See
      tests/test_shacl_validation.py for the real instance.
    slots:
      - qualified_association

slots:
  qualified_association:
    description: >-
      The qualified form of carried_out_by/prov:wasAssociatedWith. Ready to
      use, not yet used by anything in this repo: reference this slot from
      whichever Activity-side class the specialization repo defines (its own
      is_a: DataGeneratingActivity class, the way HealthDataset already
      narrows qualified_attribution to DatasetAttribution here) and its
      range is already correctly set -- no further schema work needed there
      just to make the mechanism usable.
    slot_uri: prov:qualifiedAssociation
    range: Association
    multivalued: true
    inlined_as_list: true

  agent:
    description: >-
      The agent responsible in a qualified Association -- PROV-O's own
      prov:agent. Activity-scoped (AgenticEntity, prov:Agent), matching
      carried_out_by's own range -- distinct from DatasetAttribution's
      attribution_agent (Entity-scoped, Agent/foaf:Agent), confirmed correct
      by HealthDCAT-AP's own real qualifiedAttribution example, which types
      its agent value `a foaf:Agent, foaf:Organization`, never prov:Agent.
    slot_uri: prov:agent
    range: AgenticEntity
    required: true
    inlined: true

  association_had_role:
    description: >-
      The role an agent played in a qualified Association -- PROV-O's own
      prov:hadRole, distinct from DatasetAttribution's had_role
      (dcat:hadRole, already defined by dcat-ap-plus and reused as-is):
      Association needed its own slot since dcat-ap-plus's had_role is
      hardwired to the dcat: predicate, not prov:. Range is a plain
      uriorcurie into an external codelist, not a nested Role object with
      title/description -- matches HealthDCAT-AP's own real
      qualifiedAttribution example (a bare ISO 19115 CI_RoleCode URI, not an
      inline dcat:Role), and avoids a real LinkML limitation found by
      testing: a class-plus-scalar any_of union between Role and uriorcurie
      doesn't reliably validate both shapes (see DatasetAttribution's own
      had_role in the port script for the fuller writeup of that test).
    slot_uri: prov:hadRole
    range: uriorcurie
    required: true
    values_from:
      - https://standards.iso.org/iso/19115/resources/Codelists/gml/CI_RoleCode.xml
