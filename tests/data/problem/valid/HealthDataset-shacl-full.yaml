id: https://example.org/dataset/cancer-registry-2024
title:
  - "Regional cancer incidence registry 2024"
description:
  - "Annual registry of new cancer diagnoses, regional coverage."
identifier:
  - "https://example.org/dataset/cancer-registry-2024"
keyword:
  - cancer
  - registry
theme:
  # dcat:theme's real shape requires this exact fixed term in addition to
  # whatever else (mdr-vocabularies.shape.ttl, sh:Violation severity), plus
  # a bare IRI (sh:nodeKind sh:IRI) -- both confirmed directly against
  # HealthDCAT-AP's real shapes, see docs/architecture-verification.md
  # section 6.
  - http://publications.europa.eu/resource/authority/data-theme/HEAL
# EXPLOITABLE was also invented (same real-catalogue check as
# health_category/health_theme/has_coding_system above) -- STATISTICAL
# ("Statistical data") is the real code, and the right fit for an annual
# aggregate incidence registry.
type:
  - http://publications.europa.eu/resource/authority/dataset-type/STATISTICAL
contact_point:
  - has_email: "mailto:data-access@example.org"
# dct:accessRights's real shape requires this exact fixed value
# (sh:hasValue, non-public-shapes.ttl) -- confirmed directly, see
# docs/architecture-verification.md section 6.
access_rights: http://publications.europa.eu/resource/authority/access-right/NON_PUBLIC
# Real ELI (European Legislation Identifier) for Regulation (EU) 2025/327,
# the EHDS (European Health Data Space) Regulation itself -- confirmed
# resolvable directly, not assumed. Previously a fake example.org URI with
# "eu-2025-327" already baked into the id, suggesting this was always meant
# to be EHDS -- just missing the real identifier.
applicable_legislation:
  - http://data.europa.eu/eli/reg/2025/327/oj
documentation:
  - id: https://example.org/doc/methodology
landing_page:
  - id: https://example.org/dataset/cancer-registry-2024/landing
language:
  - http://publications.europa.eu/resource/authority/language/ENG
provenance:
  - title: Collected under regional ethics approval REC-2023-114.
temporal_coverage:
  - start_date: "2024-01-01"
    end_date: "2024-12-31"
temporal_resolution:
  - P1D
is_referenced_by:
  - id: https://example.org/publications/cancer-registry-report-2024
frequency:
  - http://publications.europa.eu/resource/authority/frequency/ANNUAL
sample:
  - access_URL:
      - id: https://example.org/dataset/cancer-registry-2024/sample
    applicable_legislation:
      - http://data.europa.eu/eli/reg/2025/327/oj
dataset_distribution:
  - access_URL:
      - id: https://example.org/dataset/cancer-registry-2024/download
    applicable_legislation:
      - http://data.europa.eu/eli/reg/2025/327/oj
analytics:
  - access_URL:
      - id: https://example.org/dataset/cancer-registry-2024/analytics
    applicable_legislation:
      - http://data.europa.eu/eli/reg/2025/327/oj
hdab:
  name:
    - National Health Data Access Body
  # HealthAgent_Shape's own predicate (cv:contactPoint), not
  # dcat:contactPoint -- see agent_contact_point's own definition and
  # docs/architecture-verification.md section 6.
  agent_contact_point:
    email:
      - "hdab@example.org"
custodian:
  name:
    - Regional Cancer Registry Authority
  agent_contact_point:
    email:
      - "custodian@example.org"
# ONCOLOGY and CANCER (below) were both invented, plausible-sounding codes
# -- confirmed directly against the real cached vocabulary catalogue
# Sciensano's own official HealthDCAT-AP validator preloads (repos/
# healthdcat-ap/.../HealthDCAT-AP_validator/config/rdf-validator/ehds/
# catalogue/), not assumed. healthcategories is EHDS Article 51's *data
# category* list (genetic data, claims data, registry data, ...), not a
# disease/specialty list -- PHDR ("data from population-based health data
# registries such as public health registries") is the real code that
# actually fits a cancer *registry* dataset. health-theme is the
# disease/specialty-like list; CANCER_DISEASE ("Cancer" / "Malignant
# neoplasms, including site-specific cancers and childhood cancers") is
# the real code there -- bare CANCER doesn't exist.
health_category:
  - https://hdeu-dcat.acceptance.data.health.europa.eu/resource/authority/healthcategories/PHDR
health_theme:
  - https://hdeu-dcat.acceptance.data.health.europa.eu/resource/authority/health-theme/CANCER_DISEASE
# All three DPV terms below checked directly against DPV's real turtle
# source, not assumed -- see tests/data/real_vocabulary_terms.ttl for the
# exact confirmed triples. LegalObligation was already correct. The other
# two were invented, plausible-sounding but non-existent terms (dpv-pd's
# real prefix is pd:, not dpv-pd:, and neither MedicalHealthInsurance nor
# MedicalResearchPurpose exist anywhere in DPV) -- replaced with the
# closest genuinely real terms: pd:MedicalHealth (a dpv:PersonalData,
# dpv:SpecialCategoryPersonalData) and dpv:ScientificResearch (a dpv:Purpose).
has_legal_basis:
  - https://w3id.org/dpv#LegalObligation
has_personal_data:
  - https://w3id.org/dpv/pd#MedicalHealth
has_purpose:
  - https://w3id.org/dpv#ScientificResearch
# Deliberately kept local (example.org), not swapped for an external
# registry ID: checked directly, there is no shared global registry of
# "quality certificates" the way there is for legislation (ELI) or DPV
# concepts -- a quality certificate is an assertion a specific organization
# makes about a specific dataset, inherently instance-specific. The real
# shape requires sh:class dqv:QualityCertificate, which needs an explicit
# rdf:type triple on the value -- currently missing because
# QualityCertificate is one of the auto-stubbed, single-slot (id-only)
# classes, and LinkML/rdflib_dumper collapses a single-identifier-slot class
# to a bare URI reference rather than a typed object (see
# docs/architecture-verification.md's stub-class section). Not fixed here:
# doing so would change that collapsing behavior for every other bare-URI
# reference built the same way, a bigger design call than this fixture
# should make unilaterally.
has_quality_annotation:
  - https://example.org/quality-certificate/iso-27001
has_structured_data: true
has_code_values:
  - ICD-O-3
# ICD_O_3 (underscored) doesn't exist in the real coding-system vocabulary
# -- confirmed directly against the real cached catalogue (see comment
# above); the real code is hyphenated, ICD-O-3, matching has_code_values.
has_coding_system:
  - https://hdeu-dcat.acceptance.data.health.europa.eu/resource/authority/coding-system/ICD-O-3
# Switched from a local, instance-specific schema URI to a real member of
# HealthDCAT-AP's own standard vocabulary -- confirmed directly against the
# real cached catalogue (standard.rdf): FHIR is a real skos:Concept +
# dct:Standard entry there, with its own skos:inScheme triple. A cancer
# registry plausibly does conform to FHIR as its exchange format, so this
# is a real fix, not just a substitution for validation's sake.
conforms_to:
  - https://hdeu-dcat.acceptance.data.health.europa.eu/resource/authority/standard/FHIR
max_typical_age: 99
min_typical_age: 0
number_of_records: 45000
number_of_unique_individuals: 42000
population_coverage:
  - National
related_resource:
  - id: https://example.org/dataset/cancer-mortality-2024
retention_period:
  start_date: "2024-01-01"
  end_date: "2044-01-01"
qualified_attribution:
  - attribution_agent:
      name:
        - "National Cancer Registry Data Processor"
    attribution_had_role: https://standards.iso.org/iso/19115/resources/Codelists/gml/CI_RoleCode.xml#processor
# AssociatedDataGeneratingActivity instances (DataGeneratingActivity, with
# qualified_association wired in -- see the class's own docstring in
# health_dcat_ap_plus.yaml). Loaded and constructed separately in
# tests/test_shacl_validation.py's _build_test_dataset_graph, not by
# HealthDataset's own construction directly (its was_generated_by is
# declared range: DataGeneratingActivity, which has no qualified_association
# field at all -- the plain dcat-ap-plus class was never meant to carry
# roles); the real ISO 19115 CI_RoleCode terms below (principalInvestigator/
# sponsor/funder) are standard codelist values, not invented.
was_generated_by:
  - id: https://example.org/activity/cancer-registry-collection-2024
    title:
      - "Cancer registry data collection process"
    qualified_association:
      - agent:
          id: https://orcid.org/0000-0002-1825-0097
          title: "Dr. Maria Santos"
        association_had_role: https://standards.iso.org/iso/19115/resources/Codelists/gml/CI_RoleCode.xml#principalInvestigator
      - agent:
          id: https://ror.org/00k4n6c32
          title: "National Institute of Public Health"
        association_had_role: https://standards.iso.org/iso/19115/resources/Codelists/gml/CI_RoleCode.xml#sponsor
      - agent:
          id: https://ror.org/03yrm5c26
          title: "European Health Research Council"
        association_had_role: https://standards.iso.org/iso/19115/resources/Codelists/gml/CI_RoleCode.xml#funder
is_about_entity:
  - id: https://example.org/population/regional-cancer-patients-2024
    title: "Regional cancer patient population, 2024 cohort"
is_about_activity:
  - id: https://example.org/activity/diagnostic-reporting-process
    title:
      - "Diagnostic reporting and coding process"
