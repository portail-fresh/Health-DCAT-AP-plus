# Built from:
# https://docs.github.com/en/actions/guides/building-and-testing-python
---
name: Build and test

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:

env:
  FORCE_COLOR: "1"  # Make tools pretty.

permissions: {}

jobs:
  test:

    runs-on: ubuntu-latest
    # This is a private repository, so the checkout step needs explicit read
    # access — the workflow-level `permissions: {}` above only works as-is
    # on public repos, where anonymous read is always available.
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    steps:

      # https://github.com/actions/checkout
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      # Real SHACL validation (tests/test_shacl_validation.py) needs
      # HealthDCAT-AP's own real, official shape files -- gitignored,
      # documented in README.md, shallow-cloned here so
      # test_dataset_conforms_to_real_healthdcat_ap_shacl actually runs in
      # CI instead of silently skipping (its pytest.mark.skipif checks for
      # exactly this directory). repos/dcat-ap-plus is deliberately not
      # cloned here too -- only scripts/port_healthdcat_ap_shacl_to_linkml.py
      # needs it, and that script doesn't run as part of `just test`.
      - name: Clone HealthDCAT-AP shapes
        run: git clone --depth 1 https://code.europa.eu/healthdataeu/healthdcat-ap.git repos/healthdcat-ap

      # https://github.com/astral-sh/setup-uv
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # https://github.com/actions/setup-python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install just
        run: |
          uv tool install rust-just

      - name: Install project
        run: uv sync --group dev

      - name: Run test suite
        run: just test
